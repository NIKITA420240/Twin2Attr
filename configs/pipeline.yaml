# transformer | maxpooling | fusion
training:
  model: transformer

paths:
  items: data/items.parquet
  train_matches: data/train_matches.parquet
  validation_matches: data/validation_matches.parquet
  # Optional for inspect; train_matches is used when null.
  inspect_matches: null

normalization:
  enabled: false
  source_column: attributes
  output_column: normalized_attributes
  synonyms_path: data/synonyms.parquet
  unique_attributes_path: data/unique_attributes.parquet
  n_jobs: 4
  chunk_size: 5000

split:
  # predefined reads paths.validation_matches; auto splits paths.train_matches.
  mode: predefined
  validation_fraction: 0.2
  # pair keeps duplicate/reversed pairs together; item keeps whole connected
  # item components together and is stricter, but may distort stratification.
  leakage_scope: pair
  seed: ${runtime.seed}
  candidate_splits: 128
  train_output_path: artifacts/splits/train_matches.parquet
  validation_output_path: artifacts/splits/validation_matches.parquet

pair_encoding:
  use_field_tokens: true
  # null disables per-attribute value truncation.
  max_attribute_value_tokens: 32
  # null lets the training data determine the limit.
  max_length: null
  quantile: 0.95
  sample_size: 10000
  hard_cap: 512

models_parameters:
  transformer:
    pretrained_model_path: models/cross-encoder-ms-marco-MiniLM-L12-v2
    max_epochs: 5
    hpo_trials: 10
    # Used directly when hpo_trials=1; otherwise these are initial values.
    learning_rate: 0.00002
    weight_decay: 0.01
    hpo_learning_rate_min: 0.000001
    hpo_learning_rate_max: 0.00005
    hpo_weight_decay_min: 0.0
    hpo_weight_decay_max: 0.1
    train_batch_size: 64
    eval_batch_size: 64
    gradient_accumulation_steps: 1
    warmup_ratio: 0.06
    max_grad_norm: 1.0
    early_stopping_patience: 2
    auto_find_batch_size: true
    # Batch size used by predict after the trained model is loaded.
    batch_size: 64

  maxpooling:
    vector_size: 256
    window: 5
    min_count: 2
    workers: 8
    fasttext_epochs: 10
    classifier_epochs: 50
    batch_size: 512
    validation_fraction: 0.2
    patience: 7
    dropout: 0.2
    learning_rate: 0.001
    weight_decay: 0.0001

  fusion:
    # Batch size used to extract frozen Transformer CLS embeddings.
    embedding_batch_size: 64
    hidden_dim: 256
    dropout: 0.2
    batch_size: 512
    max_epochs: 30
    patience: 5
    learning_rate: 0.001
    weight_decay: 0.0001

artifacts:
  transformer_dir: models/twin2attr/transformer
  maxpooling_path: models/twin2attr/maxpooling.joblib
  fusion_path: models/twin2attr/fusion.pt
  resolved_config_path: models/twin2attr/pipeline_config.yaml
  solution_path: solution.json

features:
  # Reserved extension point. Enabling it currently fails explicitly.
  ner:
    enabled: false
    provider: null

runtime:
  device: null
  seed: 42

logging:
  level: INFO
  file: logs/pipeline.log
  rotation: 100 MB

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
