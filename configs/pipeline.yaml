# transformer | maxpooling | fusion | boosting
training:
  model: transformer
  data_model: mix_dataset

data_model_description:
  base_dataset:
    items: data/items_human.parquet
    matches: data/matches.parquet
    validation_fraction: 0.2
    leakage_scope: pair
    candidate_splits: 128
    seed: ${runtime.seed}

  mix_dataset:
    items: data/items.parquet
    validation_source: human
    validation_fraction: 0.2
    leakage_scope: pair
    candidate_splits: 128
    seed: ${runtime.seed}

    sources:
      human:
        matches: data/matches.parquet
        weight: 3.0
        max_rows: null
        sampling_strategy: random
        splitter:
          splitter_type: binary
          score_type: label

      llm:
        matches: data/matches_llm.parquet
        weight: 1.0
        max_rows: 750000
        sampling_strategy: category_target_balanced
        splitter:
          splitter_type: binary
          score_type: votes
          total_votes: 9
          negative_threshold: 2
          positive_threshold: 7
          uncertain_action: drop

# transformer | maxpooling | fusion | boosting | cascade
inference:
  model: transformer
  transformer_dir: weights/cross-encoder-russian-msmarco
  maxpooling_path: models/twin2attr/maxpooling.joblib
  fusion_path: models/twin2attr/fusion.pt
  boosting_dir: models/twin2attr/boosting

pair_encoding:
  use_field_tokens: true
  # null disables per-attribute value truncation.
  max_attribute_value_tokens: 16
  # null lets the training data determine the limit.
  max_length: 256
  quantile: 0.95
  sample_size: 10000
  hard_cap: 512

models_parameters:
  transformer:
    pretrained_model_path: models/mmarco-mMiniLMv2-L12-H384-v1
    max_epochs: 15
    hpo_trials: 1
    # Used directly when hpo_trials=1; otherwise these are initial values.
    # Base LR for Transformer encoder layers and the value tuned by HPO.
    learning_rate: 3.0e-5
    # Only the newly added [KEY]/[VAL] rows use this embedding LR.
    embeddings_learning_rate: 1.0e-6
    train_new_token_embeddings_only: false
    # Freeze the rest of the backbone and fine-tune only its three highest layers.
    train_last_n_layers: Null
    head_learning_rate: 1.0e-4
    layerwise_lr_decay: 0.9
    weight_decay: 0.01
    hpo_learning_rate_min: 0.000001
    hpo_learning_rate_max: 0.00005
    hpo_weight_decay_min: 0.0
    hpo_weight_decay_max: 0.1
    train_batch_size: 64
    eval_batch_size: 64
    gradient_accumulation_steps: 4
    warmup_ratio: 0.06
    # Supported values: linear, cosine.
    lr_scheduler_type: cosine
    max_grad_norm: 1.0
    early_stopping_patience: 2
    auto_find_batch_size: true
    # Batch size used by predict after the trained model is loaded.
    batch_size: 256
    head:
      # default keeps the Hugging Face CLS head; pooling builds the branches below.
      type: pooling
      # Supported values: cls, mean, max, attention. Their outputs are concatenated.
      poolings: [cls, attention]
      # Empty list gives a single linear classifier after pooling.
      mlp_hidden_dims: [384]
      dropout: 0.15
      attention_hidden_dim: 192
      # Independent learned token-importance distributions, concatenated before MLP.
      attention_num_heads: 1

  maxpooling:
    vector_size: 256
    window: 5
    min_count: 2
    workers: 8
    fasttext_epochs: 10
    classifier_epochs: 50
    batch_size: 512
    patience: 7
    dropout: 0.2
    learning_rate: 0.001
    weight_decay: 0.0001

  fusion:
    # Batch size used to extract frozen Transformer CLS embeddings.
    embedding_batch_size: 64
    hidden_dim: 256
    dropout: 0.2
    batch_size: 512
    max_epochs: 30
    patience: 5
    learning_rate: 0.001
    weight_decay: 0.0001

  boosting:
    iterations: 500
    depth: 8
    learning_rate: 0.05
    loss_function: Logloss
    early_stopping_rounds: 50
    # -1 lets CatBoost use all available CPU cores.
    thread_count: -1

  cascade:
    fast_model: boosting
    main_model: transformer
    negative_threshold: 0.01
    positive_threshold: 0.99

artifacts:
  transformer_dir: models/twin2attr/transformer
  maxpooling_path: models/twin2attr/maxpooling.joblib
  fusion_path: models/twin2attr/fusion.pt
  boosting_dir: models/twin2attr/boosting
  resolved_config_path: models/twin2attr/pipeline_config.yaml
  solution_path: solution.json

features:
  # Every stage must occur exactly once; enabled controls whether it runs.
  execution_order:
    - normalization
    - ner
    - physical

  normalization:
    enabled: true
    output_column: normalized_attributes
    synonyms_path: data/synonyms.parquet
    unique_attributes_path: data/unique_attributes.parquet
    n_jobs: 4
    chunk_size: 5000
  ner:
    enabled: true
    provider: word_ner
    model_dir: models/ner/rubert_tiny2_word_ner
    cluster_centers_path: models/ner/cluster_centers.pt
    source_column: name
    output_column: ner_attributes
    enriched_column: enriched_attributes
    merge_policy: missing_only
    batch_size: 512
    max_length: 100
    use_amp: true
    semantic_cleanup: true
  physical:
    enabled: true
    source_column: name
    output_column: physical_attributes
    enriched_column: feature_attributes
    merge_policy: missing_only
    normalize_units: true
    n_jobs: 1
    chunk_size: 10000

runtime:
  device: null
  seed: 42

logging:
  level: INFO
  file: logs/pipeline.log
  rotation: 100 MB

submission:
  output_path: dist/twin2attr_submission.zip

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
