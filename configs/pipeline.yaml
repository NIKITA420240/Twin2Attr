# transformer | maxpooling | fusion | boosting | stacking
training:
  model: transformer
  data_model: mix_dataset_all_annotations
  augmentation_model: null
  data_postprocessing_model: null
  resolved_config_path: models/twin2attr/pipeline_config.yaml
  solution_path: solution.json

data_model_description:
  base_dataset:
    items: data/items_human.parquet
    matches: data/matches.parquet
    validation_fraction: 0.2
    stacking_train_fraction: 0.15
    leakage_scope: pair
    candidate_splits: 128
    seed: ${runtime.seed}

  mix_dataset:
    items: data/items.parquet
    validation_source: human
    validation_fraction: 0.2
    leakage_scope: pair
    candidate_splits: 128
    seed: ${runtime.seed}

    # For a pair present in several sources, keep rows only from the
    # first (highest-priority) source. Pair direction does not matter.
    overlap_resolution:
      enabled: true
      source_priority:
        - human
        - llm

    sources:
      human:
        matches: data/matches.parquet
        weight: 3.0
        max_rows: null
        sampling_strategy: random
        weight_model:
          type: constant
          enabled: false
        splitter:
          splitter_type: binary
          score_type: label

      llm:
        matches: data/matches_llm.parquet
        weight: 1.0
        max_rows: 750000
        sampling_strategy: category_target_balanced
        confidence_power: 2.0
        # Loss multiplier is separate from confidence-aware row sampling.
        confidence_weighting:
          enabled: false
          method: distance_from_midpoint
          min_weight_multiplier: 0.2
          power: 1.0
        # Penalize graph-local contradictions such as A=B, B=C, A!=C.
        weight_model:
          type: transitivity
          enabled: true
          penalty_strength: 1.0
          min_weight_multiplier: 0.25
          min_comparable_neighbors: 2
          confidence_weighted_violations: true
        splitter:
          splitter_type: binary
          score_type: votes
          target_mode: soft
          total_votes: 9
          negative_threshold: 2
          positive_threshold: 7
          uncertain_action: drop

  # Practical recipe under evaluation: retain the complete human + LLM
  # training pool and add 130k synthetic hard negatives at half loss weight.
  mix_dataset_hard_negative:
    items: data/items.parquet
    validation_source: human
    validation_fraction: 0.2
    leakage_scope: pair
    candidate_splits: 128
    seed: ${runtime.seed}

    overlap_resolution:
      enabled: true
      source_priority:
        - human
        - hard_negative
        - llm

    sources:
      human:
        matches: data/matches.parquet
        weight: 3.0
        max_rows: null
        sampling_strategy: random
        weight_model:
          type: constant
          enabled: false
        splitter:
          splitter_type: binary
          score_type: label

      hard_negative:
        matches: data/hard_negative_matches.parquet
        items: data/hard_negative_items.parquet
        weight: 0.5
        max_rows: 130000
        sampling_strategy: random
        weight_model:
          type: constant
          enabled: false
        splitter:
          splitter_type: binary
          score_type: label

      llm:
        matches: data/matches_llm.parquet
        weight: 1.0
        max_rows: 750000
        sampling_strategy: category_target_balanced
        confidence_power: 2.0
        confidence_weighting:
          enabled: false
          method: distance_from_midpoint
          min_weight_multiplier: 0.2
          power: 1.0
        weight_model:
          type: transitivity
          enabled: true
          penalty_strength: 1.0
          min_weight_multiplier: 0.25
          min_comparable_neighbors: 2
          confidence_weighted_violations: true
        splitter:
          splitter_type: binary
          score_type: votes
          target_mode: soft
          total_votes: 9
          negative_threshold: 2
          positive_threshold: 7
          uncertain_action: drop

  mix_dataset_codex:
    items: data/items.parquet
    validation_source: human
    validation_fraction: 0.2
    leakage_scope: pair
    candidate_splits: 128
    seed: ${runtime.seed}

    overlap_resolution:
      enabled: true
      source_priority:
        - human
        - codex_reviewed
        - llm

    sources:
      human:
        matches: data/matches.parquet
        weight: 3.0
        max_rows: null
        sampling_strategy: random
        weight_model:
          type: constant
          enabled: false
        splitter:
          splitter_type: binary
          score_type: label

      codex_reviewed:
        matches: data/matches_llm_ambiguous_reviewed.parquet
        weight: 1.0
        max_rows: null
        sampling_strategy: random
        weight_model:
          type: constant
          enabled: false
        splitter:
          splitter_type: binary
          score_type: label

      llm:
        matches: data/matches_llm.parquet
        weight: 1.0
        max_rows: 750000
        sampling_strategy: category_target_balanced
        confidence_power: 2.0
        confidence_weighting:
          enabled: false
          method: distance_from_midpoint
          min_weight_multiplier: 0.2
          power: 1.0
        weight_model:
          type: transitivity
          enabled: true
          penalty_strength: 1.0
          min_weight_multiplier: 0.25
          min_comparable_neighbors: 2
          confidence_weighted_violations: true
        splitter:
          splitter_type: binary
          score_type: votes
          target_mode: soft
          total_votes: 9
          negative_threshold: 2
          positive_threshold: 7
          uncertain_action: drop

  # Final mixed recipe with neural-reviewed 5/9 pairs. Both pseudo-label
  # sources preserve their probability/vote scores as soft training targets.
  mix_dataset_neural_review:
    items: data/items.parquet
    validation_source: human
    validation_fraction: 0.2
    leakage_scope: pair
    candidate_splits: 128
    seed: ${runtime.seed}

    overlap_resolution:
      enabled: true
      source_priority:
        - human
        - neural_review
        - llm

    sources:
      human:
        matches: data/matches.parquet
        weight: 3.0
        max_rows: null
        sampling_strategy: random
        weight_model:
          type: constant
          enabled: false
        splitter:
          splitter_type: binary
          score_type: label

      neural_review:
        matches: data/matches_llm_neural_review.parquet
        target_column: llm_score
        weight: 1.0
        max_rows: null
        sampling_strategy: random
        confidence_weighting:
          enabled: false
        weight_model:
          type: constant
          enabled: false
        splitter:
          splitter_type: binary
          score_type: probability
          target_mode: soft
          negative_threshold: 0.5
          positive_threshold: 0.5
          uncertain_action: keep

      llm:
        matches: data/matches_llm.parquet
        weight: 1.0
        max_rows: 649663
        sampling_strategy: category_target_balanced
        confidence_weighting:
          enabled: false
        weight_model:
          type: constant
          enabled: false
        splitter:
          splitter_type: binary
          score_type: votes
          target_mode: soft
          total_votes: 9
          negative_threshold: 2
          positive_threshold: 7
          uncertain_action: drop

  # Unified annotation recipe. Human labels remain the only validation source;
  # reviewed annotations replace lower-priority labels for the same pair.
  mix_dataset_all_annotations:
    items: data/items.parquet
    validation_source: human
    validation_fraction: 0.2
    leakage_scope: pair
    candidate_splits: 128
    seed: ${runtime.seed}

    overlap_resolution:
      enabled: true
      source_priority:
        - human
        - codex_reviewed
        - neural_review
        - llm

    sources:
      human:
        matches: data/matches.parquet
        weight: 3.0
        max_rows: null
        sampling_strategy: random
        weight_model:
          type: constant
          enabled: false
        splitter:
          splitter_type: binary
          score_type: label

      codex_reviewed:
        matches: data/matches_llm_ambiguous_reviewed.parquet
        weight: 1.5
        max_rows: null
        sampling_strategy: random
        weight_model:
          type: constant
          enabled: false
        splitter:
          splitter_type: binary
          score_type: label

      neural_review:
        matches: data/matches_llm_neural_review.parquet
        target_column: llm_score
        weight: 1.0
        max_rows: null
        sampling_strategy: random
        confidence_weighting:
          enabled: false
        weight_model:
          type: constant
          enabled: false
        splitter:
          splitter_type: binary
          score_type: probability
          target_mode: soft
          negative_threshold: 0.5
          positive_threshold: 0.5
          uncertain_action: keep

      llm:
        matches: data/matches_llm.parquet
        weight: 1.0
        max_rows: null
        sampling_strategy: category_target_balanced
        confidence_weighting:
          enabled: false
        weight_model:
          type: constant
          enabled: false
        splitter:
          splitter_type: binary
          score_type: votes
          target_mode: soft
          total_votes: 9
          negative_threshold: 2
          positive_threshold: 7
          uncertain_action: drop

# transformer | maxpooling | fusion | boosting | cascade | stacking
inference:
  model: transformer
  augmentation_model: null
  data_postprocessing_model: null
  solution_path: ${training.solution_path}
  transformer:
    # Keep PyTorch as the default until the exported ONNX graphs pass the
    # accuracy and end-to-end H100 benchmark gates.
    backend: pytorch
    batch_size: 1
    dtype: bfloat16
    # Prepare and prefetch batches in parallel while the GPU runs the model.
    num_workers: 8
    prefetch_factor: 2
    pin_memory: true
    non_blocking_transfer: true
    # Group similarly sized pairs and limit the tensor shapes seen by the GPU.
    length_bucketing:
      enabled: false
      padding_length_buckets:
        - 64
        - 96
        - 128
        - 160
        - 192
        - 224
        - 256
    torch_compile:
      enabled: false
      mode: reduce-overhead
      dynamic: true
    onnxruntime:
      provider: cuda
      device_id: 0
      io_binding: true
      graph_optimization: all
      fallback_to_pytorch: true
      tensorrt:
        engine_cache:
          enabled: true
          path: onnx/trt_cache
        timing_cache:
          enabled: true
        profiles:
          min_batch_size: 1
          opt_batch_size: 2048
          max_batch_size: 2048
          sequence_lengths:
            - 64
            - 96
            - 128
    # Native TensorRT backend. The engine is built from ONNX on the target GPU
    # and reused from this fingerprinted cache on subsequent evaluator stages.
    tensorrt:
      device_id: 0
      workspace_size_gb: 8
      builder_optimization_level: 3
      fallback_to_onnxruntime: true
      engine_cache:
        enabled: true
        path: onnx/native_trt_cache
      timing_cache:
        enabled: true
        path: onnx/native_trt_cache/timing.cache
      profiles:
        min_batch_size: 1
        opt_batch_size: 512
        max_batch_size: 512
        sequence_lengths:
          - 1
          - 256
          - 472

analysis:
  analysis_model: attribute_importance
  data_model: base_dataset
  augmentation_model: attribute_shuffle
  data_postprocessing_model: null

labeling:
  source_matches_path: data/matches_llm.parquet
  items_path: data/items.parquet
  # A single cumulative file; successful rows are atomically merged into it.
  output_path: data/llm_annotations/annotations.parquet
  score_column: target
  lower_p: 0.54
  upper_p: 0.56
  sample_size: 100000
  seed: ${runtime.seed}
  checkpoint_every_batches: 10
  llm:
    base_url: https://llm-proxy.t-tech.team
    model: tgpt/deepseek-v4-flash-fp8
    token_env: LLM_PROXY_TOKEN
    temperature: 0.0
    verify_ssl: false
    request_batch_size: 64
    max_concurrency: 64
    # Every next round halves concurrency until this lower bound is reached.
    min_concurrency: 32
    max_attempts: 3
    max_rounds: 1000
    retry_base_seconds: 2.0
    max_prompt_chars: 6000

augmentation_models:
  attribute_shuffle:
    shuffled_copies: 1
    keep_original: false
    seed: ${runtime.seed}
    shuffle_cards_independently: true
    skip_oversized: true

  attribute_word_dropout:
    pair_probability: 0.5
    attribute_dropout_probability: 0.15
    word_dropout_probability: 0.03
    keyboard_typo_probability: 0.01
    word_shuffle_probability: 0.0
    seed: ${runtime.seed}

data_postprocessing_models:
  attribute_sort:
    priorities_path: ${analysis_models.attribute_importance.output_dir}/${analysis_models.attribute_importance.output_file}

analysis_models:
  attribute_importance:
    model: transformer
    output_dir: analysis/attribute_importance
    # null analyzes the complete selected dataset.
    sample_size: null
    group_by_category: true
    min_occurrences: 30
    score_type: normalized_mean_attention
    output_file: attribute_importance.parquet
    metadata_file: attribute_importance_metadata.json

model_description:
  transformer:
    # Final BGE reranker with text-conditioned typed-attribute residuals.
    profile: sequence_classifier
    pretrained_model_path: models/bge-reranker-v2-m3
    artifact_dir: models/twin2attr/bge-reranker-v2-m3-gated-residual-fusion
    tokenizer:
      batch_fields:
        enabled: true
        chunk_size: 16384
    export:
      onnx:
        enabled: false
        opset: 18
        precision: float16
        dynamic_batch: true
        dynamic_sequence_length: true
        export_classifier: true
        export_encoder: true
    pair_encoding:
      use_field_tokens: true
      # null disables the pre-tokenization character hard cap.
      max_attribute_value_chars: 256
      # null disables per-attribute value truncation.
      max_attribute_value_tokens: 16
      # null lets the training data determine the limit.
      max_length: 512
      quantile: 0.95
      sample_size: 10000
      hard_cap: 512
    max_epochs: 8
    hpo_trials: 1
    # Used directly when hpo_trials=1; otherwise these are initial values.
    # Base LR for Transformer encoder layers and the value tuned by HPO.
    learning_rate: 3.0e-5
    # Unused while input embeddings are frozen. Set a positive value only with
    # train_new_token_embeddings_only=true.
    embeddings_learning_rate: null
    train_new_token_embeddings_only: false
    # Train the complete 24-layer encoder while keeping embeddings frozen.
    train_last_n_layers: 24
    # Seed the new [KEY]/[VAL] rows from meaningful existing BGE subwords before
    # freezing them. These texts are tokenized; they are not vocabulary ids.
    special_token_initialization:
      enabled: true
      key_seed_texts: [key, attribute, ключ, поле]
      value_seed_texts: [value, значение, характеристика]
    head_learning_rate: 1.0e-4
    layerwise_lr_decay: 1.0
    weight_decay: 0.01
    hpo_learning_rate_min: 0.000001
    hpo_learning_rate_max: 0.00005
    hpo_weight_decay_min: 0.0
    hpo_weight_decay_max: 0.1
    # Keep the effective batch at 256 while fitting max_length=512 on H100.
    train_batch_size: 64
    eval_batch_size: 128
    gradient_accumulation_steps: 4
    warmup_ratio: 0.06
    # Supported values: linear, cosine.
    lr_scheduler_type: cosine
    max_grad_norm: 1.0
    early_stopping_patience: 3
    auto_find_batch_size: true
    validation:
      # A fixed human-validation sample for progress diagnostics during a long
      # epoch. It never controls early stopping or best-checkpoint selection.
      fast_dev:
        enabled: true
        max_rows: 20000
        every_n_optimizer_steps: 1000
    # Train-time throughput settings. Safe optimizations are enabled by default;
    # compilation and fixed padding shapes remain opt-in.
    training_runtime:
      length_bucketing:
        enabled: true
        # Shuffle globally, then sort only inside megabatches of this many
        # microbatches to retain stochastic training.
        mega_batch_multiplier: 50
        # Keep null for minimal dynamic padding. Define discrete lengths only
        # when benchmarking torch.compile with stable tensor shapes.
        padding_length_buckets: null
      dataloader:
        num_workers: 4
        prefetch_factor: 2
        persistent_workers: true
        pin_memory: true
        non_blocking_transfer: true
      performance_logging:
        # Emit one compact summary per completed train epoch and persist the
        # same records in training_metadata.json.
        enabled: true
      token_cache:
        enabled: false
        directory: .cache/tokenized_pairs
        build_chunk_size: 4096
      torch_compile:
        enabled: false
        mode: reduce-overhead
    head:
      # native_score + text_delta + sigmoid(gate) * typed_delta.
      # Both residual outputs start at zero, preserving native BGE initially.
      type: gated_residual_fusion
      poolings: [cls, attention]
      mlp_hidden_dims: [512]
      dropout: 0.15
      attention_hidden_dim: 1024
      attention_num_heads: 3
      typed_hidden_dims: [128, 64]
      typed_layer_norm: true

  maxpooling:
    artifact_path: models/twin2attr/maxpooling.joblib
    vector_size: 256
    window: 5
    min_count: 2
    workers: 8
    fasttext_epochs: 10
    classifier_epochs: 50
    batch_size: 512
    patience: 7
    dropout: 0.2
    learning_rate: 0.001
    weight_decay: 0.0001

  fusion:
    artifact_path: models/twin2attr/fusion.pt
    # Batch size used to extract frozen Transformer CLS embeddings.
    embedding_batch_size: 64
    hidden_dim: 256
    dropout: 0.2
    batch_size: 512
    max_epochs: 30
    patience: 5
    learning_rate: 0.001
    weight_decay: 0.0001

  boosting:
    artifact_dir: models/twin2attr/boosting
    iterations: 500
    depth: 8
    learning_rate: 0.05
    loss_function: Logloss
    early_stopping_rounds: 50
    # -1 lets CatBoost use all available CPU cores.
    thread_count: -1

  cascade:
    fast_model: boosting
    main_model: transformer
    negative_threshold: 0.01
    positive_threshold: 0.99

  stacking:
    artifact_dir: models/twin2attr/stacking/boosting
    base_model: transformer
    stacking_model: boosting

features:
  # Every stage must occur exactly once; enabled controls whether it runs.
  execution_order:
    - normalization
    - ner
    - physical

  normalization:
    enabled: true
    output_column: normalized_attributes
    synonyms_path: data/synonyms.parquet
    unique_attributes_path: data/unique_attributes.parquet
    n_jobs: 8
    chunk_size: 5000
  ner:
    enabled: false
    provider: word_ner
    model_dir: models/ner/rubert_tiny2_word_ner
    cluster_centers_path: models/ner/cluster_centers.pt
    source_column: name
    output_column: ner_attributes
    enriched_column: enriched_attributes
    merge_policy: missing_only
    batch_size: 512
    max_length: 100
    use_amp: true
    semantic_cleanup: true
  physical:
    enabled: false
    source_column: name
    output_column: physical_attributes
    enriched_column: feature_attributes
    merge_policy: missing_only
    normalize_units: true
    n_jobs: 1
    chunk_size: 10000

# Pair-level features are computed only after both cards are available. They do
# not modify the serialized Transformer input; CatBoost/stacking consume them.
pair_features:
  typed_attributes:
    enabled: true
    detector: rules
    preserve_semantic_type_when_missing: true
    symmetric: true
    types:
      code: true
      physical: true
      numeric: true
      set: true
      text: true

runtime:
  device: null
  seed: 42

logging:
  level: INFO
  file: logs/pipeline.log
  rotation: 100 MB

submission:
  output_path: dist/twin2attr_submission.zip

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
