# Additive ablation for synthetic hard negatives. Both arms disable dynamic
# augmentation and use the same Transformer, seed, validation split and
# human/LLM source settings.
test_type: training_quality
reference_test: human_llm

# Start with one paired seed. Use [42, 43, 44] if the observed gain is small.
seeds:
  - 42

tests:
  human_llm:
    name: human_plus_llm_three_epochs
    overrides:
      - path: training.model
        value: transformer
      - path: training.data_model
        value: mix_dataset
      - path: training.augmentation_model
        value: null
      - path: model_description.transformer.hpo_trials
        value: 1
      - path: model_description.transformer.max_epochs
        value: 3
      - path: model_description.transformer.export.onnx.enabled
        value: false

  human_llm_hard_negative:
    name: human_plus_llm_plus_hard_negative_three_epochs
    overrides:
      - path: training.model
        value: transformer
      - path: training.data_model
        value: mix_dataset_hard_negative
      - path: training.augmentation_model
        value: null
      - path: model_description.transformer.hpo_trials
        value: 1
      - path: model_description.transformer.max_epochs
        value: 3
      - path: model_description.transformer.export.onnx.enabled
        value: false
