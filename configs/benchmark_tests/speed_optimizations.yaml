test_type: speed
reference_test: eager_reference

# Rebuilt speed suite: add new optimizations as isolated A/B cases against
# this explicit eager PyTorch reference.
tests:
  eager_reference:
    name: pytorch_eager_attention
    overrides:
      - path: inference.transformer.backend
        value: pytorch
      - path: inference.transformer.attention.implementation
        value: eager

  sdpa:
    name: pytorch_sdpa
    overrides:
      - path: inference.transformer.backend
        value: pytorch
      - path: inference.transformer.attention.implementation
        value: sdpa
