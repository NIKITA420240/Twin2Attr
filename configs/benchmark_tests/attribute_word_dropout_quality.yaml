# Independent 2x2 ablation for dynamic attribute/word noise. This measures the
# augmentation effect both on the ordinary human+LLM pool and after adding
# synthetic hard negatives.
test_type: training_quality
reference_test: human_llm

# Start with one paired seed. Use [42, 43, 44] if the observed gain is small.
seeds:
  - 42

tests:
  human_llm:
    name: human_plus_llm_without_augmentation_three_epochs
    overrides:
      - path: training.model
        value: transformer
      - path: training.data_model
        value: mix_dataset
      - path: training.augmentation_model
        value: null
      - path: model_description.transformer.hpo_trials
        value: 1
      - path: model_description.transformer.max_epochs
        value: 3
      - path: model_description.transformer.export.onnx.enabled
        value: false

  human_llm_word_dropout:
    name: human_plus_llm_with_attribute_word_dropout_three_epochs
    overrides:
      - path: training.model
        value: transformer
      - path: training.data_model
        value: mix_dataset
      - path: training.augmentation_model
        value: attribute_word_dropout
      - path: model_description.transformer.hpo_trials
        value: 1
      - path: model_description.transformer.max_epochs
        value: 3
      - path: model_description.transformer.export.onnx.enabled
        value: false

  human_llm_hard_negative:
    name: human_plus_llm_plus_hard_negative_without_augmentation_three_epochs
    overrides:
      - path: training.model
        value: transformer
      - path: training.data_model
        value: mix_dataset_hard_negative
      - path: training.augmentation_model
        value: null
      - path: model_description.transformer.hpo_trials
        value: 1
      - path: model_description.transformer.max_epochs
        value: 3
      - path: model_description.transformer.export.onnx.enabled
        value: false

  human_llm_hard_negative_word_dropout:
    name: human_plus_llm_plus_hard_negative_with_attribute_word_dropout_three_epochs
    overrides:
      - path: training.model
        value: transformer
      - path: training.data_model
        value: mix_dataset_hard_negative
      - path: training.augmentation_model
        value: attribute_word_dropout
      - path: model_description.transformer.hpo_trials
        value: 1
      - path: model_description.transformer.max_epochs
        value: 3
      - path: model_description.transformer.export.onnx.enabled
        value: false
