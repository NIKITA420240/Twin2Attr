# One command runs every enabled job below:
#   uv run python run.py benchmark
benchmark:
  # Full model, data, preprocessing, training and inference configuration.
  base_config_path: configs/benchmark_pipeline.yaml
  output_dir: analysis/benchmark
  fail_fast: false

  jobs:
    backends:
      type: inference
      enabled: false
      tests_path: configs/benchmark_tests/backends.yaml
      selected_tests: null

    speed_optimizations:
      type: inference
      enabled: false
      tests_path: configs/benchmark_tests/speed_optimizations.yaml
      selected_tests: null

    inference_quality:
      type: inference
      enabled: false
      tests_path: configs/benchmark_tests/quality_optimizations.yaml
      selected_tests: null

    # Retrains two Transformer models even with one seed.
    transitivity_quality:
      type: training_quality
      enabled: false
      tests_path: configs/benchmark_tests/transitivity_quality.yaml
      selected_tests: null

    # CatBoost screening: baseline, CODE, CODE+PHYSICAL, +SET and all types.
    # Intentionally disabled until the typed-feature implementation is reviewed.
    typed_attribute_quality:
      type: training_quality
      enabled: false
      tests_path: configs/benchmark_tests/typed_attribute_quality.yaml
      selected_tests: null

    # Retrains two paired Transformers with the same 750,000-row
    # pseudo-labeled-data budget.
    codex_annotation_quality:
      type: training_quality
      enabled: false
      tests_path: configs/benchmark_tests/codex_annotation_quality.yaml
      selected_tests: null

    # Three paired fits: current confident-only data, fixed old labels and
    # fixed neural labels. All pseudo-label weights are constant.
    neural_relabel_quality:
      type: training_quality
      enabled: false
      tests_path: configs/benchmark_tests/neural_relabel_quality.yaml
      selected_tests: null

    # Three paired fits over the same 2/7 LLM pool and 750,000-row budget.
    llm_vote_sampling_quality:
      type: training_quality
      enabled: false
      tests_path: configs/benchmark_tests/llm_vote_sampling_quality.yaml
      selected_tests: null

    # Four paired fits: one hard-label control plus the three requested
    # soft-label/confidence-weighting variants.
    soft_label_confidence_quality:
      type: training_quality
      enabled: true
      tests_path: configs/benchmark_tests/soft_label_confidence_quality.yaml
      selected_tests: null
