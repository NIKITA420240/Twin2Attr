[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[project]
name = "ozon-match"
version = "0.1.0"
description = "Product-card matching experiments"
readme = { file = "README.MD", content-type = "text/markdown" }
requires-python = ">=3.10,<3.14"
dependencies = [
    "accelerate>=1.1",
    "catboost>=1.2.8,<2",
    "hydra-core>=1.3,<2",
    "joblib>=1.4",
    "loguru>=0.7",
    "numpy>=1.26",
    "optuna>=4.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "pint>=0.24",
    "polars>=1.0",
    "pymorphy3>=2.0",
    "scikit-learn>=1.5",
    "torch>=2.2",
    "tqdm>=4.66",
    "transformers>=4.44,<5",
    "orjson>=3.11.0,<3.12",
    "gensim>=4.4.0",
    "langchain-openai==1.5.1",
]

[project.optional-dependencies]
onnx-cpu = [
    "onnx>=1.16",
    "onnxconverter-common>=1.14",
    "onnxruntime>=1.18",
]
onnx-gpu = [
    "onnx>=1.16",
    "onnxconverter-common>=1.14",
    "onnxruntime-gpu>=1.18,<1.24",
]
notebooks = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

[tool.uv.build-backend]
module-name = "match"
module-root = "src"
