job:
  time_limit: 48h
  flavor: 8cpu-128ram
  generate_name: twin2attr-label-dataset-
  description: Select uncertain product pairs and extend the cumulative LLM annotation dataset
  image: docker-hosted.artifactory.tcsbank.ru/nfs-efficiency-team/efficiency-travel-avia-pricing-dev:commit-1b2c4d32
  work_dir: /work/Twin2Attr
  env:
    # Fill this value before submitting the job. Never commit a real token.
    LLM_PROXY_TOKEN: ""
  entrypoint: /bin/bash
  args:
    - -lc
    - |
      set -euo pipefail
      if ! command -v uv >/dev/null 2>&1; then
        python -m pip install uv
      fi
      test -f data/matches_llm.parquet
      test -f data/items.parquet
      mkdir -p data/llm_annotations logs
      uv sync --python 3.12
      .venv/bin/python run.py label --config configs/pipeline.yaml
  input:
    - type: files
      src: ./
      dst: /work/Twin2Attr
      mask: run.py
    - type: files
      src: ./
      dst: /work/Twin2Attr
      mask: pyproject.toml
    - type: files
      src: ./
      dst: /work/Twin2Attr
      mask: uv.lock
    - type: files
      src: ./
      dst: /work/Twin2Attr
      mask: README.MD
    - type: files
      src: ./configs
      dst: /work/Twin2Attr/configs
      mask: "**/*"
    - type: files
      src: ./src
      dst: /work/Twin2Attr/src
      mask: "**/*"
    - type: s3msk
      bucket: nfs-efficiency-team-dev-long
      src: /hotel_pricing/experiments/ET-1016/TWIN2ATTR/data/
      dst: /work/Twin2Attr/data/
  output:
    - type: s3msk
      bucket: nfs-efficiency-team-dev-long
      src: /work/Twin2Attr/data/llm_annotations/
      dst: /hotel_pricing/experiments/ET-1016/TWIN2ATTR/data/llm_annotations/
    - type: s3msk
      bucket: nfs-efficiency-team-dev-long
      src: /work/Twin2Attr/logs/
      dst: /hotel_pricing/experiments/ET-1016/TWIN2ATTR/labeling/logs/
